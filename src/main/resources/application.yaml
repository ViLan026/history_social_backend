spring:
  application:
    name: history_social_backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/history_social}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  config:
    import: optional:classpath:application-secret.yaml


server:
  port: ${PORT:8080}

  servlet:
    context-path: /history_social


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


jwt:
  secret: ${JWT_SECRET}
  valid-duration: ${JWT_VALID_DURATION:3600000}
  refresh-duration: ${JWT_REFRESH_DURATION:604800000}


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}



ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}