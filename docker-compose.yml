services:
  postgres:
    image: postgres:17
    container_name: history-social-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: history_social
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d history_social"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - history-social-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: history-social-backend:latest
    container_name: history-social-backend
    restart: unless-stopped

    env_file:
      - .env.backend

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/history_social

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - history-social-network


volumes:
  postgres_data:


networks:
  history-social-network:
    driver: bridge